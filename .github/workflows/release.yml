name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Must match the version in bomly-plugin.json."
        required: true

permissions:
  contents: write

env:
  PLUGIN_NAME: bomly-plugin-jsreach-analyzer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify manifest version
        run: |
          manifest_version="$(jq -r .version bomly-plugin.json)"
          if [ "$manifest_version" != "${{ inputs.version }}" ]; then
            echo "bomly-plugin.json version ($manifest_version) does not match release input (${{ inputs.version }})" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build and package
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            binary="$PLUGIN_NAME"
            if [ "$goos" = "windows" ]; then
              binary="$PLUGIN_NAME.exe"
            fi
            stage="dist/stage_${goos}_${goarch}"
            mkdir -p "$stage"
            echo "building $platform"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" \
              -o "$stage/$binary" ./cmd/$PLUGIN_NAME
            cp bomly-plugin.json README.md LICENSE NOTICE "$stage/"
            archive="${PLUGIN_NAME}_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q "../${archive}.zip" "$binary" bomly-plugin.json README.md LICENSE NOTICE)
            else
              tar -czf "dist/${archive}.tar.gz" -C "$stage" "$binary" bomly-plugin.json README.md LICENSE NOTICE
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
