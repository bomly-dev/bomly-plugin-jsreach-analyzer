name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  PLUGIN_NAME: bomly-plugin-jsreach-analyzer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Require main branch
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release must be run from main, got ${GITHUB_REF}" >&2
            exit 1
          fi

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"
          current="${latest_tag#v}"
          if [[ -z "${current}" ]]; then
            current="0.0.0"
          fi
          IFS=. read -r major minor patch <<< "${current}"
          case "${BUMP}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
            *) echo "Unsupported bump type ${BUMP}" >&2; exit 1 ;;
          esac
          tag="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Sync plugin manifest and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The manifest ships inside every release archive, so a stale version
          # there means an installed plugin misreports itself. It is derived
          # from the release rather than maintained by hand, and committed
          # before the tag so the tag points at the manifest it ships.
          tmp="$(mktemp)"
          jq --arg v "${VERSION}" '.version = $v' bomly-plugin.json > "${tmp}"
          mv "${tmp}" bomly-plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- bomly-plugin.json; then
            git add bomly-plugin.json
            git commit -m "chore: release ${TAG}"
            git push origin HEAD:main
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"

      - name: Build and package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            binary="$PLUGIN_NAME"
            if [ "$goos" = "windows" ]; then
              binary="$PLUGIN_NAME.exe"
            fi
            stage="dist/stage_${goos}_${goarch}"
            mkdir -p "$stage"
            echo "building $platform"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w" \
              -o "$stage/$binary" ./cmd/$PLUGIN_NAME
            cp bomly-plugin.json README.md LICENSE NOTICE "$stage/"
            archive="${PLUGIN_NAME}_${version}_${goos}_${goarch}"
            if [ "$goos" = "windows" ]; then
              (cd "$stage" && zip -q "../${archive}.zip" "$binary" bomly-plugin.json README.md LICENSE NOTICE)
            else
              tar -czf "dist/${archive}.tar.gz" -C "$stage" "$binary" bomly-plugin.json README.md LICENSE NOTICE
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS
