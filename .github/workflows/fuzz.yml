name: Fuzz

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run fuzz targets (60s each)
        run: |
          set -euo pipefail
          targets="
            FuzzExtractImportedPackages
            FuzzEntryPointStrings
          "
          for target in $targets; do
            echo "fuzzing $target"
            go test ./plugin -run '^$' -fuzz "^${target}$" -fuzztime 60s
          done
